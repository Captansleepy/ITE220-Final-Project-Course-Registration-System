<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940"><rect width="1240" height="940" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b45;font-size:15px} .field{font-size:16px} .title{font-size:22px;font-weight:bold} path{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#64748b;stroke:none;marker-end:none"/></marker></defs><text x="40" y="38" class="title">Course Registration System — Database Design</text><text x="40" y="64">MongoDB collections and ObjectId references • Based on server/src/models</text><path d="M220 355 V475"/><text x="230" y="424">1 → many (student)</text><path d="M620 355 V475"/><text x="630" y="424">1 → many</text><path d="M1020 355 V405 H800 V510 H800"/><text x="837" y="392">term: 1 → many</text><path d="M400 600 H440"/><text x="407" y="590">N:1</text><path d="M120 355 V445 H820 V580 H840"/><text x="280" y="437">student: 1 → many records</text><path d="M800 220 H825 V610 H840"/><text x="808" y="465" transform="rotate(-90 808 465)">course: 1 → many records</text><path d="M1080 355 V475"/><text x="1090" y="440">1 → many</text><path d="M40 170 H16 V285 H40"/><text x="48" y="341">advisor: one user → many students</text><rect x="40" y="90" width="360" height="265" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="90" width="360" height="44" rx="10" fill="#172b45"/><text x="56" y="119" style="fill:white;font-size:20px;font-weight:bold">users</text><text x="56" y="162" class="field">ObjectId _id</text><text x="56" y="186" class="field">String name, email</text><text x="56" y="210" class="field">String passwordHash</text><text x="56" y="234" class="field">enum role: admin | advisor | student</text><text x="56" y="258" class="field">String studentId (students)</text><text x="56" y="282" class="field">ObjectId advisor → users (students)</text><text x="56" y="306" class="field">Boolean active</text><rect x="440" y="90" width="360" height="265" rx="10" fill="white" stroke="#cbd5e1"/><rect x="440" y="90" width="360" height="44" rx="10" fill="#172b45"/><text x="456" y="119" style="fill:white;font-size:20px;font-weight:bold">courses</text><text x="456" y="162" class="field">ObjectId _id</text><text x="456" y="186" class="field">String code (unique), title</text><text x="456" y="210" class="field">Number credits (4)</text><text x="456" y="234" class="field">String description</text><rect x="840" y="90" width="360" height="265" rx="10" fill="white" stroke="#cbd5e1"/><rect x="840" y="90" width="360" height="44" rx="10" fill="#172b45"/><text x="856" y="119" style="fill:white;font-size:20px;font-weight:bold">terms</text><text x="856" y="162" class="field">ObjectId _id</text><text x="856" y="186" class="field">String code (unique)</text><text x="856" y="210" class="field">Boolean isCurrent, isFinalised</text><text x="856" y="234" class="field">Number registrationRevision</text><rect x="40" y="475" width="360" height="265" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="475" width="360" height="44" rx="10" fill="#172b45"/><text x="56" y="504" style="fill:white;font-size:20px;font-weight:bold">registrations</text><text x="56" y="547" class="field">ObjectId _id</text><text x="56" y="571" class="field">ObjectId student → users</text><text x="56" y="595" class="field">ObjectId offering → offerings</text><text x="56" y="619" class="field">enum status: registered | dropped</text><rect x="440" y="475" width="360" height="265" rx="10" fill="white" stroke="#cbd5e1"/><rect x="440" y="475" width="360" height="44" rx="10" fill="#172b45"/><text x="456" y="504" style="fill:white;font-size:20px;font-weight:bold">offerings</text><text x="456" y="547" class="field">ObjectId _id</text><text x="456" y="571" class="field">ObjectId course → courses</text><text x="456" y="595" class="field">ObjectId term → terms</text><text x="456" y="619" class="field">Number section, capacity</text><text x="456" y="643" class="field">meetings[]: day, startTime, endTime</text><text x="456" y="667" class="field">String room, instructor</text><text x="456" y="691" class="field">Boolean addDropOpen</text><text x="456" y="715" class="field">Date addDropClosesAt</text><rect x="840" y="475" width="360" height="265" rx="10" fill="white" stroke="#cbd5e1"/><rect x="840" y="475" width="360" height="44" rx="10" fill="#172b45"/><text x="856" y="504" style="fill:white;font-size:20px;font-weight:bold">records</text><text x="856" y="547" class="field">ObjectId _id</text><text x="856" y="571" class="field">ObjectId student → users</text><text x="856" y="595" class="field">ObjectId course → courses</text><text x="856" y="619" class="field">ObjectId term → terms</text><text x="856" y="643" class="field">enum grade: A, B+, B, C+, C,</text><text x="856" y="667" class="field">D+, D, F, W</text><text x="40" y="785">All six models define createdAt / updatedAt timestamps. Lines show collection relationships; labels show cardinality.</text><text x="40" y="814">Unique keys: users.email; users.studentId (strings only); courses.code; terms.code;</text><text x="40" y="838">offerings(course, term, section); records(student, course, term); registrations(student, offering).</text><text x="40" y="870">Seats remaining = capacity − active registrations. Current registrations hold in-progress courses; records hold grades.</text><text x="40" y="902">Internal collection: admin_mutation_guards {_id, revision} serializes admin account changes; no academic references.</text></svg>